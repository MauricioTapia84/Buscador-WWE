services:
  api:
    build:
      context: ../api
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    volumes:
      - ../data:/app/data
    depends_on:
      - db
    env_file:
      - ../.env

  dashboard:
    build:
      context: ../dashboards
      dockerfile: Dockerfile.dashboard
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api

  db:
    image: postgres:15
    env_file:
      - ../.env
    volumes:
      - db_data:/var/lib/postgresql/data

  etl-runner:
    build:
      context: ../etl
      dockerfile: Dockerfile.etl
    volumes:
      - ../data:/app/data
    depends_on:
      - db
    restart: 'no'
    environment:
      - THESPORTSDB_API_KEY=${THESPORTSDB_API_KEY:-3}
      - ENABLE_WIKIPEDIA_ENRICHMENT=1
    command: ["tail", "-f", "/dev/null"]

volumes:
  db_data:
